<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E2A52"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3C158"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- shield: authorization -->
  <path d="M32 8 L50 15 V30 C50 42 42 50 32 56 C22 50 14 42 14 30 V15 Z"
        fill="url(#shieldGrad)" stroke="#1A1422" stroke-width="1.5"/>

  <!-- inner shield face -->
  <path d="M32 13 L45 18.5 V30 C45 39.5 39 46 32 50.5 C25 46 19 39.5 19 30 V18.5 Z"
        fill="#241B2F"/>

  <!-- lock body: authentication -->
  <rect x="25" y="30" width="14" height="12" rx="2" fill="#3E8989"/>
  <path d="M28 30 V26 a4 4 0 0 1 8 0 V30" fill="none" stroke="#3E8989" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="35" r="1.8" fill="#F4EFE6"/>
  <rect x="31" y="35.5" width="2" height="3.5" rx="1" fill="#F4EFE6"/>
</svg>
